name: Verify Windows source

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/d2-highlights-desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/d2-highlights-desktop
        run: npm ci

      - name: Prepare FFmpeg resources
        shell: powershell
        run: |
          choco install ffmpeg -y --no-progress
          New-Item -ItemType Directory -Path tools\ffmpeg\bin -Force | Out-Null
          Copy-Item (Get-Command ffmpeg.exe).Source tools\ffmpeg\bin\ffmpeg.exe
          Copy-Item (Get-Command ffprobe.exe).Source tools\ffmpeg\bin\ffprobe.exe

      - name: Verify source
        shell: powershell
        run: .\scripts\verify.ps1
