[package]
name = "d2-highlights-desktop"
version.workspace = true
description = "Local Dota 2 highlight analysis desktop application"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true

[lib]
name = "d2_highlights_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cat-cut-assistant"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
d2-highlights-core = { path = "../../../crates/d2-highlights-core" }
d2-highlights-pipeline = { path = "../../../crates/d2-highlights-pipeline" }
d2-highlights-renderer = { path = "../../../crates/d2-highlights-renderer" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.10.1"

[dev-dependencies]
tempfile.workspace = true
