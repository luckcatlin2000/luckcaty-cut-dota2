[workspace]
members = [
    "apps/d2-highlights-cli",
    "apps/d2-highlights-desktop/src-tauri",
    "crates/d2-highlights-core",
    "crates/d2-highlights-detector",
    "crates/d2-highlights-director",
    "crates/d2-highlights-parser-source2",
    "crates/d2-highlights-pipeline",
    "crates/d2-highlights-replay-control",
    "crates/d2-highlights-renderer",
]
resolver = "2"

[workspace.package]
version = "1.6.0"
edition = "2024"
rust-version = "1.89"
authors = ["luckcatlin2000"]
repository = "https://github.com/luckcatlin2000/luckcaty-cut-dota2"
license-file = "LICENSE"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
source2-demo = { version = "=0.5.8", default-features = false, features = ["dota"] }
tempfile = "3.20"
thiserror = "2.0"

[profile.release]
lto = "thin"
strip = "symbols"
